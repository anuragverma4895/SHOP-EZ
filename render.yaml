services:
  # 1. AI Recommendation Service (Python)
  - type: web
    name: shop-ez-ai
    env: python
    plan: free
    rootDir: ai_service
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"

  # 2. Backend Service (Node.js)
  - type: web
    name: shop-ez-backend
    env: node
    plan: free
    buildCommand: "npm install && cd backend && npm install"
    startCommand: "node index.js"
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: shop-ez-ai
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: shop-ez-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # 3. Frontend Service (React SPA)
  - type: web
    name: shop-ez-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: shop-ez-backend
          envVarKey: RENDER_EXTERNAL_URL
